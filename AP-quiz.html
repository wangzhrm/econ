<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Architect - Student Tracker</title>
    <script>
        window.MathJax = { 
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            chtml: { displayAlign: 'left' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { --primary: #1890ff; --bg: #f4f7f9; --border: #e5e7eb; --accent: #722ed1; --text: #1f2937; --success: #52c41a; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: var(--text); }
        
        /* Layout */
        .layout { display: grid; grid-template-columns: 350px 1fr; gap: 25px; max-width: 1800px; margin: auto; }
        .sidebar { 
            background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
            height: fit-content; max-height: calc(100vh - 40px); position: sticky; top: 20px; 
            display: flex; flex-direction: column; box-sizing: border-box;
        }
        
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; margin-top: 5px; }
        
        /* Left-aligned Chapters Filter */
        #chapterFilterList {
            max-height: 250px; overflow-y: auto; margin-top: 8px; padding: 10px;
            border: 1px solid #f0f0f0; border-radius: 6px; background: #fafafa;
            display: flex; flex-direction: column; align-items: flex-start;
        }
        .filter-header { display: flex; justify-content: space-between; align-items: center; margin-top: 15px; }
        .filter-links a { font-size: 0.75rem; color: var(--primary); cursor: pointer; text-decoration: none; font-weight: bold; margin-left: 8px; }
        .filter-item { display: flex; align-items: center; gap: 12px; padding: 6px 0; font-size: 0.85rem; width: 100%; text-align: left; cursor: pointer; }
        .filter-item input { width: 18px; height: 18px; margin: 0; cursor: pointer; }

        /* Table UI */
        .main-content { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 12px; border-bottom: 2px solid var(--border); border-right: 1px solid var(--border); font-size: 0.8rem; }
        td { padding: 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); vertical-align: top; }
        
        .row-chapter { background: #f0f7ff; font-weight: 800; color: var(--primary); }
        .row-knowledge { background: #fafafa; font-style: italic; color: #722ed1; }
        
        /* IMPROVED CHECKBOX STYLING */
        .select-cell { 
            text-align: center; 
            cursor: pointer; 
            transition: background 0.2s;
            position: relative;
        }
        .select-cell:hover { background: #e6f7ff; }
        .q-check { 
            width: 22px; 
            height: 22px; 
            cursor: pointer;
            margin: 0;
            accent-color: var(--primary);
        }

        /* Quiz Action Buttons */
        .quiz-actions { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
        .btn-action { font-size: 10px; cursor: pointer; font-weight: bold; padding: 5px 2px; border-radius: 4px; border: 1px solid transparent; text-align: center; }
        .btn-reprint { background: #e6f7ff; color: #1890ff; border-color: #91d5ff; }
        .btn-sol { background: #f6ffed; color: #52c41a; border-color: #b7eb8f; }
        .btn-delete { background: #fff1f0; color: #f5222d; border-color: #ffa39e; grid-column: span 2; }
        
        .q-display-area { line-height: 1.6; white-space: pre-wrap; }
        .q-image { max-width: 300px; border-radius: 8px; border: 1px solid #eee; margin-top: 12px; display: block; }
        .sol-box { display: none; padding: 15px; background: #fffbe6; border: 1px solid #ffe58f; border-radius: 8px; font-size: 0.95rem; margin-top: 10px; }

        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-gen { background: var(--success); color: white; }
        .counter-float { background: var(--primary); color: white; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; }

        @media print {
            .sidebar, .no-print, .quiz-actions, th:nth-child(n+2), td:nth-child(n+2) { display: none !important; }
            body { background: white; padding: 0; }
            .layout { display: block; }
            .main-content { box-shadow: none; }
            table, tbody, tr, td { display: block !important; width: 100% !important; border: none !important; }
            body.clean-print .row-chapter, body.clean-print .row-knowledge { display: none !important; }
            .row-question { border-bottom: 2px solid #f0f0f0 !important; padding: 25px 0 !important; page-break-inside: avoid; }
            .q-display-area { font-size: 1.1rem; }
            .q-image { max-width: 100% !important; }
            body.show-solutions-print .sol-box { display: block !important; }
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar no-print">
        <h3>Student Management</h3>
        <input type="text" id="newStudentName" placeholder="Enter name...">
        <button class="btn" style="background: var(--accent); color: white;" onclick="addStudent()">+ Create Student</button>
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        <h3>Quiz Architect</h3>
        <select id="studentSelect" onchange="refreshView()">
            <option value="">-- Select Student --</option>
        </select>

        <div id="quizOptions" style="display:none; margin-top:15px;">
            <div class="counter-float">Selected: <span id="selCount">0</span></div>
            <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 15px;">
                <input type="checkbox" id="includeSolutions" style="width: auto;"> <strong>Include Solutions</strong>
            </label>
            <div class="filter-header">
                <strong>Filter Chapters:</strong>
                <div class="filter-links">
                    <a onclick="toggleAllFilters(true)">All</a>
                    <a onclick="toggleAllFilters(false)" style="color:#f5222d;">None</a>
                </div>
            </div>
            <div id="chapterFilterList"></div>
            <button class="btn btn-gen" onclick="generateAndSave()">Generate & Export</button>
        </div>
    </div>

    <div class="main-content">
        <table id="masterTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody">
                <tr><td colspan="100" style="text-align:center; padding:50px; color:#999;">Select a student to begin.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBt9RHAT0FiA7PPh16zlnfxC6ayrI84yGc",
        authDomain: "econap-f858f.firebaseapp.com",
        projectId: "econap-f858f",
        storageBucket: "econap-f858f.firebasestorage.app",
        messagingSenderId: "71599790063",
        appId: "1:71599790063:web:3a27262d254e667200c81a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dbData = { cats: [], knowledge: [], questions: [], students: [], quizzes: [] };
    let selectedQs = new Set();
    let selectedChapterIds = new Set();
    let visibleChapters = [];

    async function init() {
        const [cSnap, kSnap, qSnap, sSnap, zSnap] = await Promise.all([
            getDocs(collection(db, "Category")), getDocs(collection(db, "Knowledge")),
            getDocs(collection(db, "MathQuestion")), getDocs(collection(db, "Students")),
            getDocs(collection(db, "Quizzes"))
        ]);
        dbData.cats = cSnap.docs.map(d => ({id: d.id, ...d.data()}));
        dbData.knowledge = kSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.order||0) - (b.order||0));
        dbData.questions = qSnap.docs.map(d => ({id: d.id, ...d.data()}));
        dbData.students = sSnap.docs.map(d => ({id: d.id, ...d.data()}));
        dbData.quizzes = zSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
        
        const roots = dbData.cats.filter(c => !c.parent && !c.name.toLowerCase().includes("year"));
        visibleChapters = dbData.cats.filter(c => {
            const pid = c.parent?.id || c.parent;
            return roots.some(r => r.id === pid) && dbData.knowledge.some(k => k.categoryId === c.id);
        }).sort((a,b) => (a.order||0) - (b.order||0));
        
        if(selectedChapterIds.size === 0) visibleChapters.forEach(c => selectedChapterIds.add(c.id));
        populateStudents();
    }

    function populateStudents() {
        const sel = document.getElementById('studentSelect');
        sel.innerHTML = '<option value="">-- Select Student --</option>' + 
            dbData.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    window.refreshView = () => {
        document.getElementById('quizOptions').style.display = 'block';
        renderFilters();
        renderTable();
    };

    function renderFilters() {
        const list = document.getElementById('chapterFilterList');
        list.innerHTML = visibleChapters.map(chap => `
            <label class="filter-item">
                <input type="checkbox" value="${chap.id}" ${selectedChapterIds.has(chap.id)?'checked':''} onchange="updateFilters(this)">
                <span>${chap.name}</span>
            </label>
        `).join('');
    }

    window.updateFilters = (cb) => {
        cb.checked ? selectedChapterIds.add(cb.value) : selectedChapterIds.delete(cb.value);
        renderTable();
    };

    window.toggleAllFilters = (check) => {
        selectedChapterIds.clear();
        if(check) visibleChapters.forEach(c => selectedChapterIds.add(c.id));
        renderFilters();
        renderTable();
    };

    function renderTable() {
        const studentId = document.getElementById('studentSelect').value;
        if(!studentId) return;
        const studentQuizzes = dbData.quizzes.filter(z => z.studentId === studentId);
        
        const head = document.getElementById('tableHead');
        let hHtml = `<tr><th style="text-align:left;">Question Content(4/9/13/12/15/7)</th><th class="no-print">Select</th>`;
        studentQuizzes.forEach(z => {
            hHtml += `<th class="no-print">${z.quizName}<div class="quiz-actions">
                <span class="btn-action btn-reprint" onclick="reprintQuiz('${z.id}', false)">Export</span>
                <span class="btn-action btn-sol" onclick="reprintQuiz('${z.id}', true)">Sol</span>
                <span class="btn-action btn-delete" onclick="removeQuiz('${z.id}')">Delete</span>
            </div></th>`;
        });
        head.innerHTML = hHtml + `</tr>`;

        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        let qCount = 1;

        visibleChapters.forEach(chap => {
            if(!selectedChapterIds.has(chap.id)) return;
            let chapAdded = false;

            dbData.knowledge.filter(k => k.categoryId === chap.id).forEach(kn => {
                let knAdded = false;

                dbData.questions.filter(q => q.knowledgeIds?.includes(kn.id)).forEach(q => {
                    if(!chapAdded) { body.innerHTML += `<tr class="row-chapter"><td colspan="100">📁 ${chap.name}</td></tr>`; chapAdded = true; }
                    if(!knAdded) { body.innerHTML += `<tr class="row-knowledge"><td colspan="100" style="padding-left:30px;">💡 ${kn.latex}</td></tr>`; knAdded = true; }

                    const isSel = selectedQs.has(q.id);
                    const row = document.createElement('tr');
                    row.className = "row-question " + (isSel ? "selected-for-print" : "no-print");

                    let cells = `
                        <td style="padding-left: 50px;">
                            <div class="q-display-area"><strong>Question ${isSel ? qCount++ : ''}:</strong><br>${q.latexQuestion.replace(/\n/g, '<br>')}</div>
                            ${q.diagramUrl ? `<img src="${q.diagramUrl}" class="q-image">` : ''}
                            <div class="sol-box"><strong>Solution:</strong><br>${(q.latexSolution || '').replace(/\n/g, '<br>')}</div>
                        </td>
                        <td class="no-print select-cell" onclick="handleCellClick(event, '${q.id}')">
                            <input type="checkbox" class="q-check" ${isSel?'checked':''} onclick="event.stopPropagation()">
                        </td>
                    `;
                    studentQuizzes.forEach(z => {
                        cells += `<td class="no-print" style="text-align:center;">${z.questionIds.includes(q.id)?'✓':''}</td>`;
                    });
                    row.innerHTML = cells;
                    body.appendChild(row);
                });
            });
        });
        if (window.MathJax) MathJax.typesetPromise();
    }

    // Helper to allow clicking anywhere in the cell
    window.handleCellClick = (e, qId) => {
        const checkbox = e.currentTarget.querySelector('input');
        checkbox.checked = !checkbox.checked;
        window.toggleQ(qId, checkbox);
    };

    window.toggleQ = (id, cb) => {
        cb.checked ? selectedQs.add(id) : selectedQs.delete(id);
        document.getElementById('selCount').innerText = selectedQs.size;
        renderTable();
    };

    window.generateAndSave = async () => {
        const studentId = document.getElementById('studentSelect').value;
        if(selectedQs.size === 0) return alert("Select questions first.");
        const includeSols = document.getElementById('includeSolutions').checked;
        const quizName = new Date().toLocaleDateString();
        await addDoc(collection(db, "Quizzes"), {
            studentId, quizName, questionIds: Array.from(selectedQs), 
            includeSolutions: includeSols, timestamp: Date.now()
        });
        document.body.classList.add('clean-print');
        if(includeSols) document.body.classList.add('show-solutions-print');
        await init();
        renderTable();
        setTimeout(() => {
            window.print();
            document.body.classList.remove('clean-print', 'show-solutions-print');
            selectedQs.clear();
            renderTable();
        }, 500);
    };

    window.reprintQuiz = (quizId, forceSolutions) => {
        const quiz = dbData.quizzes.find(z => z.id === quizId);
        selectedQs = new Set(quiz.questionIds);
        document.body.classList.add('clean-print');
        if(forceSolutions || quiz.includeSolutions) { document.body.classList.add('show-solutions-print'); }
        renderTable();
        setTimeout(() => {
            window.print();
            document.body.classList.remove('clean-print', 'show-solutions-print');
            selectedQs.clear();
            renderTable();
        }, 500);
    };

    window.removeQuiz = async (id) => {
        if(confirm("Delete this stored quiz record?")) { await deleteDoc(doc(db, "Quizzes", id)); await init(); renderTable(); }
    };

    window.addStudent = async () => {
        const name = document.getElementById('newStudentName').value;
        if(name) { await addDoc(collection(db, "Students"), { name }); await init(); populateStudents(); }
    };

    init();
</script>
</body>
</html>
