<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Architect | Ultra-Compact</title>
    <script>
        window.MathJax = { 
            tex: { inlineMath: [['$', '$']], displayMath: [['$$', '$$']] },
            chtml: { displayAlign: 'left' }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        :root { 
            --primary: #2563eb; --bg: #f1f5f9; --sidebar-bg: #ffffff;
            --border: #e2e8f0; --text-main: #0f172a; --text-muted: #64748b; 
            --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
            --accent: #8b5cf6; --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: var(--text-main); font-size: 14px; }
        .layout { display: grid; grid-template-columns: 280px 1fr; gap: 15px; height: calc(100vh - 30px); }

        /* Sidebar */
        .sidebar { background: var(--sidebar-bg); padding: 15px; border-radius: 10px; box-shadow: var(--shadow); overflow-y: auto; display: flex; flex-direction: column; }
        h3 { font-size: 0.9rem; margin-bottom: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        input[type="text"], select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 10px; font-size: 0.85rem; }

        #chapterFilterList { flex-grow: 1; overflow-y: auto; margin-bottom: 10px; border: 1px solid #f8fafc; }
        .filter-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 0.8rem; cursor: pointer; }
        .filter-item input { width: 15px; height: 15px; margin: 0; flex-shrink: 0; }

        /* Main Table Layout */
        .main-content { background: white; border-radius: 10px; box-shadow: var(--shadow); overflow: auto; position: relative; }
        table { border-collapse: collapse; min-width: 100%; table-layout: fixed; }
        
        /* Column Widths */
        .col-q { width: 450px; position: sticky; left: 0; z-index: 10; background: white; border-right: 2px solid var(--border) !important; }
        .col-select { width: 45px; text-align: center; }
        .col-quiz { width: 55px; text-align: center; border-right: 1px solid #f1f5f9; vertical-align: top; }

        thead th { position: sticky; top: 0; z-index: 20; background: #f8fafc; padding: 10px 5px; border-bottom: 2px solid var(--border); font-size: 0.65rem; color: var(--text-muted); }
        thead th.col-q { z-index: 30; }

        td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
        
        .row-chapter { background: #eff6ff; font-weight: 700; color: var(--primary); font-size: 0.8rem; }
        .row-knowledge { background: #fafafa; font-weight: 500; color: var(--accent); font-size: 0.75rem; }
        
        /* Miniature Quiz Buttons */
        .quiz-actions { display: flex; flex-direction: column; gap: 2px; margin-top: 5px; align-items: center; }
        .btn-mini { width: 22px; height: 22px; line-height: 20px; font-size: 10px; font-weight: 900; border-radius: 4px; border: none; cursor: pointer; color: white; display: block; text-align: center; }
        .b-p { background: var(--primary); } 
        .b-s { background: var(--success); }
        .b-e { background: var(--warning); }
        .b-x { background: var(--danger); }
        
        .q-display-area { font-size: 0.9rem; line-height: 1.5; color: #334155; }
        .q-image { max-width: 100%; height: auto; border-radius: 6px; margin-top: 8px; border: 1px solid #eee; }
        .sol-box { display: none; padding: 10px; background: #fffbeb; border: 1px solid #fef3c7; border-radius: 6px; font-size: 0.8rem; margin-top: 8px; color: #92400e; }

        .btn-main { width: 100%; padding: 10px; border-radius: 6px; border: none; font-weight: 700; cursor: pointer; background: var(--primary); color: white; margin-top: 5px; }
        .btn-alt { background: var(--accent); }
        .counter { background: #1e293b; color: white; padding: 8px; border-radius: 6px; text-align: center; font-weight: bold; margin-bottom: 10px; font-size: 0.8rem; }

        @media print {
            .sidebar, .no-print, .quiz-actions, th:not(.col-q), td:not(.col-q) { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .layout { display: block !important; }
            .main-content { overflow: visible !important; }
            .col-q { width: 100% !important; position: static !important; border: none !important; }
            .row-question { border-bottom: 1px solid #eee !important; padding: 20px 0 !important; page-break-inside: avoid; display: none !important; }
            body.printing-mode .selected-for-print { display: block !important; }
            body.show-solutions-print .sol-box { display: block !important; }
        }
    </style>
</head>
<body>

<div class="layout">
    <div class="sidebar no-print">
        <h3>Profiles</h3>
        <input type="text" id="newStudentName" placeholder="Student Name...">
        <button class="btn-main btn-alt" onclick="addStudent()">+ Create</button>
        
        <hr style="margin: 15px 0; border: 0; border-top: 1px solid var(--border);">
        
        <h3>Architect</h3>
        <select id="studentSelect" onchange="exitEditMode(); refreshView()">
            <option value="">-- Choose --</option>
        </select>

        <div id="quizOptions" style="display:none;">
            <div id="editBanner" style="display:none; padding:8px; background:#fff7e6; border:1px solid #fa8c16; border-radius:6px; margin-bottom:10px; font-size:0.75rem;">
                <strong>Editing Quiz</strong><br><a href="#" onclick="exitEditMode()" style="color:red">Cancel</a>
            </div>
            <div class="counter">Sel: <span id="selCount">0</span></div>
            <label style="font-size: 0.75rem; display: flex; align-items: center; gap: 5px; margin-bottom: 10px;">
                <input type="checkbox" id="includeSolutions"> Include Sols
            </label>
            <div id="chapterFilterList"></div>
            <button id="mainBtn" class="btn-main" onclick="handleGenerate()">Sync & Export</button>
        </div>
    </div>

    <div class="main-content">
        <table id="masterTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody">
                <tr><td colspan="100" style="text-align:center; padding-top:50px; color:#94a3b8;">Choose a profile to start.</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyBt9RHAT0FiA7PPh16zlnfxC6ayrI84yGc",
        authDomain: "econap-f858f.firebaseapp.com",
        projectId: "econap-f858f",
        storageBucket: "econap-f858f.firebasestorage.app",
        messagingSenderId: "71599790063",
        appId: "1:71599790063:web:3a27262d254e667200c81a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    let dbData = { cats: [], knowledge: [], questions: [], students: [], quizzes: [] };
    let selectedQs = new Set();
    let selectedChapterIds = new Set();
    let visibleChapters = [];
    let currentEditQuizId = null;

    async function init() {
        const [cSnap, kSnap, qSnap, sSnap, zSnap] = await Promise.all([
            getDocs(collection(db, "Category")), getDocs(collection(db, "Knowledge")),
            getDocs(collection(db, "MathQuestion")), getDocs(collection(db, "Students")),
            getDocs(collection(db, "Quizzes"))
        ]);
        dbData.cats = cSnap.docs.map(d => ({id: d.id, ...d.data()}));
        dbData.knowledge = kSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => (a.order||0) - (b.order||0));
        dbData.questions = qSnap.docs.map(d => ({id: d.id, ...d.data()}));
        dbData.students = sSnap.docs.map(d => ({id: d.id, ...d.data()}));
        dbData.quizzes = zSnap.docs.map(d => ({id: d.id, ...d.data()})).sort((a,b) => b.timestamp - a.timestamp);
        
        const roots = dbData.cats.filter(c => !c.parent && !c.name.toLowerCase().includes("year"));
        visibleChapters = dbData.cats.filter(c => {
            const pid = c.parent?.id || c.parent;
            return roots.some(r => r.id === pid) && dbData.knowledge.some(k => k.categoryId === c.id);
        }).sort((a,b) => (a.order||0) - (b.order||0));
        
        if(selectedChapterIds.size === 0) visibleChapters.forEach(c => selectedChapterIds.add(c.id));
        populateStudents();
    }

    function populateStudents() {
        const sel = document.getElementById('studentSelect');
        sel.innerHTML = '<option value="">-- Choose --</option>' + 
            dbData.students.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
    }

    window.refreshView = () => {
        document.getElementById('quizOptions').style.display = 'block';
        renderFilters();
        renderTable();
    };

    function renderFilters() {
        const list = document.getElementById('chapterFilterList');
        list.innerHTML = visibleChapters.map(chap => `
            <label class="filter-item">
                <input type="checkbox" value="${chap.id}" ${selectedChapterIds.has(chap.id)?'checked':''} onchange="updateFilters(this)">
                <span>${chap.name}</span>
            </label>
        `).join('');
    }

    window.updateFilters = (cb) => {
        cb.checked ? selectedChapterIds.add(cb.value) : selectedChapterIds.delete(cb.value);
        renderTable();
    };

    function renderTable() {
        const studentId = document.getElementById('studentSelect').value;
        if(!studentId) return;
        const studentQuizzes = dbData.quizzes.filter(z => z.studentId === studentId);
        
        const head = document.getElementById('tableHead');
        let hHtml = `<tr><th class="col-q">Content & Figures</th><th class="col-select no-print">+</th>`;
        studentQuizzes.forEach(z => {
            hHtml += `<th class="col-quiz no-print">
                <div style="font-size:9px; line-height:1">${z.quizName}</div>
                <div class="quiz-actions">
                    <button class="btn-mini b-p" title="Print" onclick="reprintQuiz('${z.id}', false)">P</button>
                    <button class="btn-mini b-s" title="Solutions" onclick="reprintQuiz('${z.id}', true)">S</button>
                    <button class="btn-mini b-e" title="Edit" onclick="enterEditMode('${z.id}')">E</button>
                    <button class="btn-mini b-x" title="Delete" onclick="removeQuiz('${z.id}')">X</button>
                </div>
            </th>`;
        });
        head.innerHTML = hHtml + `</tr>`;

        const body = document.getElementById('tableBody');
        body.innerHTML = "";
        let qCount = 1;

        visibleChapters.forEach(chap => {
            if(!selectedChapterIds.has(chap.id)) return;
            body.innerHTML += `<tr class="row-chapter"><td colspan="100">📁 ${chap.name}</td></tr>`;

            dbData.knowledge.filter(k => k.categoryId === chap.id).forEach(kn => {
                body.innerHTML += `<tr class="row-knowledge"><td colspan="100" style="padding-left:15px;">↳ ${kn.latex}</td></tr>`;

                dbData.questions.filter(q => q.knowledgeIds?.includes(kn.id)).forEach(q => {
                    const isSel = selectedQs.has(q.id);
                    const row = document.createElement('tr');
                    row.className = "row-question " + (isSel ? "selected-for-print" : "no-print");

                    let cells = `
                        <td class="col-q">
                            <div class="q-display-area"><strong>Q${isSel ? qCount++ : ''}:</strong> ${q.latexQuestion.replace(/\n/g, '<br>')}</div>
                            ${q.diagramUrl ? `<img src="${q.diagramUrl}" class="q-image">` : ''}
                            <div class="sol-box"><strong>Sol:</strong><br>${(q.latexSolution || '').replace(/\n/g, '<br>')}</div>
                        </td>
                        <td class="col-select no-print" onclick="handleCellClick(event, '${q.id}')">
                            <input type="checkbox" style="width:18px;height:18px;" ${isSel?'checked':''} onclick="event.stopPropagation()">
                        </td>
                    `;
                    studentQuizzes.forEach(z => {
                        cells += `<td class="col-quiz no-print" style="color:var(--success); font-weight:bold;">${z.questionIds.includes(q.id)?'✓':''}</td>`;
                    });
                    row.innerHTML = cells;
                    body.appendChild(row);
                });
            });
        });
        if (window.MathJax) MathJax.typesetPromise();
    }

    window.handleCellClick = (e, qId) => {
        const checkbox = e.currentTarget.querySelector('input');
        checkbox.checked = !checkbox.checked;
        window.toggleQ(qId, checkbox);
    };

    window.toggleQ = (id, cb) => {
        cb.checked ? selectedQs.add(id) : selectedQs.delete(id);
        document.getElementById('selCount').innerText = selectedQs.size;
        renderTable();
    };

    window.enterEditMode = (quizId) => {
        const quiz = dbData.quizzes.find(z => z.id === quizId);
        currentEditQuizId = quizId;
        selectedQs = new Set(quiz.questionIds);
        document.getElementById('selCount').innerText = selectedQs.size;
        document.getElementById('includeSolutions').checked = !!quiz.includeSolutions;
        document.getElementById('editBanner').style.display = 'block';
        document.getElementById('mainBtn').innerText = "Update Record";
        renderTable();
    };

    window.exitEditMode = () => {
        currentEditQuizId = null;
        selectedQs.clear();
        document.getElementById('selCount').innerText = "0";
        document.getElementById('editBanner').style.display = 'none';
        document.getElementById('mainBtn').innerText = "Sync & Export";
        renderTable();
    };

    window.handleGenerate = async () => {
        const studentId = document.getElementById('studentSelect').value;
        if(selectedQs.size === 0) return alert("Select questions.");
        const includeSols = document.getElementById('includeSolutions').checked;
        const qArray = Array.from(selectedQs);

        if(currentEditQuizId) {
            await updateDoc(doc(db, "Quizzes", currentEditQuizId), { questionIds: qArray, includeSolutions: includeSols });
            await init();
            exitEditMode();
        } else {
            const quizName = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'short' });
            await addDoc(collection(db, "Quizzes"), { studentId, quizName, questionIds: qArray, includeSolutions: includeSols, timestamp: Date.now() });
            document.body.classList.add('printing-mode', 'clean-print');
            if(includeSols) document.body.classList.add('show-solutions-print');
            await init();
            renderTable();
            setTimeout(() => {
                window.print();
                document.body.classList.remove('printing-mode', 'clean-print', 'show-solutions-print');
                selectedQs.clear();
                exitEditMode();
            }, 800);
        }
    };

    window.reprintQuiz = (quizId, forceSolutions) => {
        const quiz = dbData.quizzes.find(z => z.id === quizId);
        selectedQs = new Set(quiz.questionIds);
        document.body.classList.add('printing-mode', 'clean-print');
        if(forceSolutions || quiz.includeSolutions) document.body.classList.add('show-solutions-print');
        renderTable();
        setTimeout(() => {
            window.print();
            document.body.classList.remove('printing-mode', 'clean-print', 'show-solutions-print');
            selectedQs.clear();
            renderTable();
        }, 1000);
    };

    window.removeQuiz = async (id) => {
        if(confirm("Delete this quiz?")) { await deleteDoc(doc(db, "Quizzes", id)); await init(); renderTable(); }
    };

    window.addStudent = async () => {
        const name = document.getElementById('newStudentName').value;
        if(name) { await addDoc(collection(db, "Students"), { name }); await init(); populateStudents(); }
    };

    init();
</script>
</body>
</html>
